<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Peggy的旅行地圖口袋名單</title>
  
  <!-- PWA 支援 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Peggy地圖">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- 效能優化 CDN 預解析 -->
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>

  <!-- 完整資料檔 -->
  <script src="data.js" defer></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 9999px;
    }
    .place-card {
      content-visibility: auto;
      contain-intrinsic-size: 0 165px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- 頂部導航列 -->
  <header class="bg-white/95 border-b border-slate-200 sticky top-0 z-40 shadow-xs backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-2xl shadow-inner shrink-0">
          <i class="ph-fill ph-star"></i>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
            Peggy的旅行地圖口袋名單
            <span id="total-badge" class="text-xs bg-slate-100 text-slate-600 font-semibold px-2 py-0.5 rounded-full border border-slate-200">0 筆</span>
          </h1>
          <p class="text-xs text-slate-500">台灣與國外・即時測距・PWA 離線手機 App</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- PWA 安裝按鈕 (支援時自動顯示) -->
        <button id="btn-pwa-install" class="hidden inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 shadow-xs transition active:scale-95 animate-pulse">
          <i class="ph-bold ph-download-simple"></i> 安裝至手機桌面
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-5 flex-1 w-full space-y-4">

    <!-- 控制與篩選區域 -->
    <section class="bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-5 shadow-xs space-y-3.5">
      
      <!-- 放大版超強智慧搜尋列 -->
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-4 sm:pl-5 flex items-center pointer-events-none text-slate-400 group-focus-within:text-indigo-600 transition text-xl sm:text-2xl">
          <i class="ph ph-magnifying-glass"></i>
        </div>
        <input 
          id="search-input" 
          type="text" 
          placeholder="搜尋任何關鍵字（支援複合搜尋，如：韓國燒肉、清邁咖啡、基隆小吃、日本拉麵...）"
          class="w-full pl-12 sm:pl-14 pr-12 py-3.5 sm:py-4 bg-slate-50/80 hover:bg-white focus:bg-white border-2 border-slate-200 hover:border-slate-300 focus:border-indigo-500 rounded-2xl text-base sm:text-lg font-medium shadow-2xs focus:shadow-md focus:outline-none transition-all placeholder:text-slate-400 placeholder:text-sm sm:placeholder:text-base text-slate-800"
        />
        <button id="btn-clear-search" class="hidden absolute inset-y-0 right-0 pr-4 sm:pr-5 flex items-center text-slate-400 hover:text-slate-600 transition">
          <i class="ph-fill ph-x-circle text-2xl"></i>
        </button>
      </div>

      <!-- 第一層維度：範圍切換 (全部 / 台灣地區 / 國外地區 / 現在地點定位) -->
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 pt-1 border-t border-slate-100">
        <span class="font-bold text-slate-600 flex items-center gap-1 text-xs min-w-[55px] shrink-0">
          <i class="ph ph-globe-hemisphere-east text-sm text-indigo-600"></i> 範圍：
        </span>
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 text-xs">
          <button id="scope-all" onclick="setScope('ALL')" class="scope-btn px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 bg-slate-900 text-white shadow-xs">
            <span>全部地區</span>
            <span id="badge-scope-all" class="text-[10px] opacity-80">(0)</span>
          </button>
          <button id="scope-tw" onclick="setScope('TW')" class="scope-btn px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200">
            <span>🇹🇼 台灣地區</span>
            <span id="badge-scope-tw" class="text-[10px] opacity-80">(0)</span>
          </button>
          <button id="scope-intl" onclick="setScope('INTL')" class="scope-btn px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200">
            <span>✈️ 國外地區</span>
            <span id="badge-scope-intl" class="text-[10px] opacity-80">(0)</span>
          </button>

          <!-- 關鍵功能：以現在地點定位 -->
          <button id="scope-nearby" onclick="locateAndSortNearby()" class="scope-btn px-3.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 bg-amber-500/10 text-amber-700 border border-amber-300 hover:bg-amber-500 hover:text-white shadow-xs active:scale-95 ml-auto sm:ml-0">
            <i id="gps-icon" class="ph-bold ph-crosshair text-sm"></i>
            <span id="gps-btn-text">📍 離我最近 (GPS 定位)</span>
          </button>
        </div>
      </div>

      <!-- 第二層維度：細分地區標籤 (隨 Scope 自動切換) -->
      <div id="sub-region-section" class="flex flex-col sm:flex-row items-start sm:items-baseline gap-2 text-xs pt-1 border-t border-slate-100">
        <span id="sub-region-label" class="font-bold text-slate-600 flex items-center gap-1 min-w-[55px] shrink-0">
          <i class="ph ph-map-pin text-sm text-indigo-500"></i> 縣市：
        </span>
        <div id="regions-container" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar pr-1">
          <!-- 動態生成地區按鈕 -->
        </div>
      </div>

      <!-- 第三層維度：分類標籤過濾 -->
      <div class="flex flex-col sm:flex-row items-start sm:items-baseline gap-2 text-xs pt-1 border-t border-slate-100">
        <span class="font-bold text-slate-600 flex items-center gap-1 min-w-[55px] shrink-0">
          <i class="ph ph-tag text-sm text-amber-500"></i> 分類：
        </span>
        <div id="categories-container" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scrollbar pr-1">
          <!-- 動態生成分類按鈕 -->
        </div>
      </div>

      <!-- 結果狀態與排序篩選 -->
      <div class="flex flex-wrap items-center justify-between gap-3 text-xs text-slate-500 pt-2 border-t border-slate-100">
        <div>
          符合條件 <span id="filtered-count" class="font-bold text-indigo-600 text-sm">0</span> 筆
          <span id="filter-status-desc" class="ml-1 text-slate-400"></span>
          <span id="showing-count" class="text-slate-400 ml-1.5 font-medium"></span>
        </div>

        <div class="flex flex-wrap items-center gap-3">
          <label id="sort-control" class="flex items-center gap-1 cursor-pointer select-none">
            <span class="text-slate-400">排序：</span>
            <select id="sort-select" class="bg-transparent font-medium text-slate-700 outline-none cursor-pointer">
              <option value="distance">依距離由近到遠</option>
              <option value="newest">最新收藏</option>
              <option value="region">按地區排序</option>
              <option value="category">按分類排序</option>
              <option value="name">店名排序</option>
            </select>
          </label>
          <button id="btn-reset-filters" class="hover:text-indigo-600 font-semibold text-indigo-500 hidden flex items-center gap-0.5">
            <i class="ph ph-arrow-counter-clockwise"></i> 清除篩選
          </button>
        </div>
      </div>
    </section>

    <!-- 卡片列表區 -->
    <section id="list-view-section">
      <div id="places-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
        <!-- 卡片動態渲染 -->
      </div>

      <!-- 載入更多按鈕與提示 -->
      <div id="load-more-container" class="text-center py-6 hidden">
        <button id="btn-load-more" class="px-6 py-2.5 bg-white border border-slate-200 text-slate-700 hover:bg-slate-50 rounded-xl text-xs font-semibold shadow-xs transition active:scale-95">
          載入更多地點 (還有 <span id="remaining-count">0</span> 筆)
        </button>
      </div>

      <!-- 無資料時的空狀態 -->
      <div id="empty-state" class="hidden text-center py-16 px-4 bg-white rounded-2xl border border-dashed border-slate-300 my-4">
        <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-3">
          <i class="ph ph-map-pin-line"></i>
        </div>
        <h3 class="text-base font-bold text-slate-700 mb-1">找不到符合條件的地點</h3>
        <p class="text-xs text-slate-400 max-w-sm mx-auto mb-4">請嘗試切換地區/國家標籤，或清除搜尋字詞。</p>
        <button id="btn-empty-reset" class="px-4 py-2 text-xs font-semibold rounded-lg bg-indigo-50 text-indigo-600 hover:bg-indigo-100 transition">
          清除所有條件
        </button>
      </div>
    </section>

  </main>

  <!-- 頁尾 -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    Peggy的旅行地圖口袋名單・支援 PWA 離線手機 App 與即時測距
  </footer>

  <!-- JavaScript 主邏輯 -->
  <script>
    const STORAGE_KEY = 'PEGGY_STARRED_PLACES_CUSTOM_MODS';
    const PAGE_SIZE = 45;

    let places = [];
    let currentFiltered = [];
    let renderedCount = 0;

    // 篩選維度
    let currentScope = 'ALL';
    let selectedRegion = '全部';
    let selectedCategory = '全部';
    let searchQuery = '';
    let sortMode = 'newest';

    // GPS 狀態
    let userLocation = null;
    let isLocating = false;

    // PWA Install Prompt
    let deferredPrompt = null;

    function buildSearchIndex(item) {
      item._s = `${item.name} ${item.address || ''} ${item.region || ''} ${item.category || ''} ${item.note || ''}`.toLowerCase();
    }

    function init() {
      places = window.PEGGY_STARRED_PLACES || [];

      const customMods = localStorage.getItem(STORAGE_KEY);
      if (customMods) {
        try {
          const mods = JSON.parse(customMods);
          if (Array.isArray(mods) && mods.length > 0) {
            places = [...mods, ...places];
          }
        } catch (e) {}
      }

      const len = places.length;
      for (let i = 0; i < len; i++) {
        buildSearchIndex(places[i]);
      }

      setupEvents();
      setupPWA();
      renderAll();
    }

    // PWA 註冊與安裝提示
    function setupPWA() {
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js').then((reg) => {
            console.log('ServiceWorker registered:', reg.scope);
          }).catch((err) => {
            console.warn('ServiceWorker registration failed:', err);
          });
        });
      }

      const pwaBtn = document.getElementById('btn-pwa-install');
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        pwaBtn.classList.remove('hidden');
      });

      pwaBtn.addEventListener('click', () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            pwaBtn.classList.add('hidden');
          }
          deferredPrompt = null;
        });
      });
    }

    function setupEvents() {
      let debounceTimer = null;
      const searchInput = document.getElementById('search-input');
      const clearSearchBtn = document.getElementById('btn-clear-search');

      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          searchQuery = e.target.value.trim().toLowerCase();
          clearSearchBtn.classList.toggle('hidden', searchQuery === '');
          filterAndRender(true);
        }, 120);
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        filterAndRender(true);
      });

      document.getElementById('sort-select').addEventListener('change', (e) => {
        sortMode = e.target.value;
        filterAndRender(true);
      });

      document.getElementById('btn-reset-filters').addEventListener('click', resetFilters);
      document.getElementById('btn-empty-reset').addEventListener('click', resetFilters);

      document.getElementById('btn-load-more').addEventListener('click', () => {
        appendCardsChunk();
      });

      let scrollThrottled = false;
      window.addEventListener('scroll', () => {
        if (scrollThrottled) return;
        scrollThrottled = true;
        requestAnimationFrame(() => {
          if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
            if (renderedCount < currentFiltered.length) {
              appendCardsChunk();
            }
          }
          scrollThrottled = false;
        });
      }, { passive: true });
    }

    function calculateDistanceKm(lat1, lon1, lat2, lon2) {
      if (lat1 == null || lon1 == null || lat2 == null || lon2 == null) return null;
      const R = 6371;
      const p = 0.017453292519943295;
      const c = Math.cos;
      const a = 0.5 - c((lat2 - lat1) * p)/2 + 
                c(lat1 * p) * c(lat2 * p) * 
                (1 - c((lon2 - lon1) * p))/2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function formatDistance(distanceKm) {
      if (distanceKm == null) return null;
      if (distanceKm < 1) {
        return `${Math.round(distanceKm * 1000)} 公尺`;
      } else if (distanceKm < 10) {
        return `${distanceKm.toFixed(1)} 公里`;
      } else {
        return `${Math.round(distanceKm)} 公里`;
      }
    }

    window.locateAndSortNearby = function() {
      currentScope = 'NEARBY';

      const btnText = document.getElementById('gps-btn-text');
      const icon = document.getElementById('gps-icon');
      btnText.innerText = "正在取得 GPS 定位...";
      icon.className = "ph-bold ph-spinner animate-spin text-sm";

      if (!navigator.geolocation) {
        alert("您的裝置未開放 GPS 定位。");
        btnText.innerText = "📍 離我最近";
        icon.className = "ph-bold ph-crosshair text-sm";
        updateScopeButtonsUI();
        filterAndRender(true);
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          icon.className = "ph-bold ph-crosshair text-sm";
          btnText.innerText = "📍 離我最近";

          userLocation = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };

          sortMode = 'distance';
          document.getElementById('sort-select').value = 'distance';

          // 計算所有地點的距離數值
          const uLat = userLocation.lat;
          const uLng = userLocation.lng;
          const len = places.length;
          for (let i = 0; i < len; i++) {
            const p = places[i];
            if (p.lat && p.lng) {
              p.distanceKm = calculateDistanceKm(uLat, uLng, p.lat, p.lng);
            } else {
              p.distanceKm = null;
            }
          }

          updateScopeButtonsUI();
          renderRegionButtons();
          filterAndRender(true);
        },
        (error) => {
          icon.className = "ph-bold ph-crosshair text-sm";
          btnText.innerText = "📍 離我最近";

          let msg = "尚未取得您的精確定位。";
          if (error.code === 1) {
            msg = "瀏覽器已封鎖位置權限，請在網址列左側點擊「鎖頭/網站設定」允許位置存取以進行即時測距。";
          }
          alert(msg);

          userLocation = { lat: 25.0478, lng: 121.5318 };
          sortMode = 'distance';
          const uLat = userLocation.lat;
          const uLng = userLocation.lng;
          for (let i = 0; i < places.length; i++) {
            const p = places[i];
            p.distanceKm = p.lat && p.lng ? calculateDistanceKm(uLat, uLng, p.lat, p.lng) : null;
          }
          updateScopeButtonsUI();
          renderRegionButtons();
          filterAndRender(true);
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
      );
    };

    function resetFilters() {
      currentScope = 'ALL';
      selectedRegion = '全部';
      selectedCategory = '全部';
      searchQuery = '';
      sortMode = userLocation ? 'distance' : 'newest';
      document.getElementById('sort-select').value = sortMode;
      document.getElementById('search-input').value = '';
      document.getElementById('btn-clear-search').classList.add('hidden');

      updateScopeButtonsUI();
      renderRegionButtons();
      renderCategoryButtons();
      filterAndRender(true);
    }

    function renderAll() {
      document.getElementById('total-badge').innerText = `${places.length.toLocaleString()} 筆`;
      updateScopeBadges();
      updateScopeButtonsUI();
      renderRegionButtons();
      renderCategoryButtons();
      filterAndRender(true);
    }

    function updateScopeBadges() {
      let twCount = 0;
      let intlCount = 0;
      const len = places.length;
      for (let i = 0; i < len; i++) {
        if (places[i].scope === 'TW') twCount++;
        else if (places[i].scope === 'INTL') intlCount++;
      }
      document.getElementById('badge-scope-all').innerText = `(${len.toLocaleString()})`;
      document.getElementById('badge-scope-tw').innerText = `(${twCount.toLocaleString()})`;
      document.getElementById('badge-scope-intl').innerText = `(${intlCount.toLocaleString()})`;
    }

    function updateScopeButtonsUI() {
      const btnAll = document.getElementById('scope-all');
      const btnTW = document.getElementById('scope-tw');
      const btnINTL = document.getElementById('scope-intl');
      const btnNearby = document.getElementById('scope-nearby');
      const label = document.getElementById('sub-region-label');

      [btnAll, btnTW, btnINTL].forEach(b => {
        b.className = 'scope-btn px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200';
      });

      btnNearby.className = 'scope-btn px-3.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 bg-amber-500/10 text-amber-700 border border-amber-300 hover:bg-amber-500 hover:text-white shadow-xs active:scale-95 ml-auto sm:ml-0';

      if (currentScope === 'ALL') {
        btnAll.className = 'scope-btn px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 bg-slate-900 text-white shadow-xs';
        label.innerHTML = '<i class="ph ph-map-pin text-sm text-indigo-500"></i> 地區：';
      } else if (currentScope === 'TW') {
        btnTW.className = 'scope-btn px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 bg-indigo-600 text-white shadow-xs';
        label.innerHTML = '<i class="ph ph-map-pin text-sm text-indigo-500"></i> 台灣縣市：';
      } else if (currentScope === 'INTL') {
        btnINTL.className = 'scope-btn px-3 py-1.5 rounded-lg font-semibold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow-xs';
        label.innerHTML = '<i class="ph ph-airplane text-sm text-emerald-500"></i> 國外國家：';
      } else if (currentScope === 'NEARBY') {
        btnNearby.className = 'scope-btn px-3.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1.5 bg-amber-600 text-white shadow-xs ring-2 ring-amber-400 active:scale-95 ml-auto sm:ml-0';
        label.innerHTML = '<i class="ph ph-map-pin text-sm text-amber-500"></i> 地區：';
      }
    }

    window.setScope = function(scope) {
      currentScope = scope;
      selectedRegion = '全部';

      updateScopeButtonsUI();
      renderRegionButtons();
      filterAndRender(true);
    };

    function renderRegionButtons() {
      const regMap = {};
      const len = places.length;
      let poolCount = 0;

      for (let i = 0; i < len; i++) {
        const p = places[i];
        if (currentScope === 'TW' && p.scope !== 'TW') continue;
        if (currentScope === 'INTL' && p.scope !== 'INTL') continue;
        const r = p.region || '其他';
        regMap[r] = (regMap[r] || 0) + 1;
        poolCount++;
      }

      const sortedRegions = Object.keys(regMap).sort((a, b) => {
        if (a === '其他' || a === '其他海外') return 1;
        if (b === '其他' || b === '其他海外') return -1;
        return regMap[b] - regMap[a];
      });

      sortedRegions.unshift('全部');

      const container = document.getElementById('regions-container');
      const activeColor = currentScope === 'INTL' ? 'bg-emerald-600 text-white' : 'bg-indigo-600 text-white';

      container.innerHTML = sortedRegions.map(reg => {
        const count = reg === '全部' ? poolCount : (regMap[reg] || 0);
        const isActive = selectedRegion === reg;
        return `
          <button 
            onclick="setRegion('${reg}')"
            class="px-2.5 py-1 rounded-lg font-medium transition flex items-center gap-1 text-xs shrink-0 ${
              isActive 
                ? `${activeColor} shadow-xs font-semibold` 
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
            }">
            <span>${reg}</span>
            <span class="text-[10px] opacity-75">(${count})</span>
          </button>
        `;
      }).join('');
    }

    function renderCategoryButtons() {
      const catMap = {};
      const len = places.length;
      for (let i = 0; i < len; i++) {
        const c = places[i].category || '其他';
        catMap[c] = (catMap[c] || 0) + 1;
      }

      const priority = [
        "全部", "景點", "餐廳", "小吃", "戶外/生活購物", 
        "甜點/烘焙", "咖啡廳", "住宿/飯店", "酒吧/餐酒館", 
        "早餐/早午餐", "按摩/SPA/體驗", "交通/設施", "其他"
      ];
      const existingCats = Object.keys(catMap);
      const sortedCats = ["全部", ...priority.filter(c => c !== "全部" && existingCats.includes(c)), ...existingCats.filter(c => !priority.includes(c))];

      const container = document.getElementById('categories-container');
      container.innerHTML = sortedCats.map(cat => {
        const count = cat === '全部' ? places.length : (catMap[cat] || 0);
        const isActive = selectedCategory === cat;
        return `
          <button 
            onclick="setCategory('${cat}')"
            class="px-2.5 py-1 rounded-lg font-medium transition flex items-center gap-1 text-xs shrink-0 ${
              isActive 
                ? 'bg-amber-600 text-white shadow-xs font-semibold' 
                : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
            }">
            <span>${cat}</span>
            <span class="text-[10px] opacity-75">(${count})</span>
          </button>
        `;
      }).join('');
    }

    window.setRegion = function(reg) {
      selectedRegion = reg;
      renderRegionButtons();
      filterAndRender(true);
    };

    window.setCategory = function(cat) {
      selectedCategory = cat;
      renderCategoryButtons();
      filterAndRender(true);
    };

    const AUTO_SPLIT_REGIONS = [
      "韓國", "日本", "泰國", "越南", "冰島", "土耳其", "澳門", "香港", "印尼", "新加坡", "馬爾地夫",
      "基隆", "台北", "新北", "桃園", "新竹", "苗栗", "台中", "彰化", "南投", "雲林", "嘉義", "台南", "高雄", "屏東", "宜蘭", "花蓮", "台東", "澎湖", "金門", "馬祖",
      "清邁", "曼谷", "普吉", "東京", "大阪", "京都", "福岡", "沖繩", "北海道", "名古屋", "首爾", "釜山", "峴港", "河內", "胡志明", "峇里島", "九份", "礁溪", "羅東", "墾丁", "日月潭", "阿里山"
    ];

    function parseSearchTokens(rawQuery) {
      if (!rawQuery) return [];
      let text = rawQuery.trim().toLowerCase();
      text = text.replace(/清賣/g, "清邁").replace(/魯肉飯/g, "滷肉飯").replace(/臺/g, "台");

      if (text.includes(" ") || text.includes("+") || text.includes(",")) {
        return text.split(/[\s+,]+/).filter(t => t.length > 0);
      }

      for (let i = 0; i < AUTO_SPLIT_REGIONS.length; i++) {
        const reg = AUTO_SPLIT_REGIONS[i].toLowerCase();
        if (text.startsWith(reg) && text.length > reg.length) {
          const rest = text.substring(reg.length).trim();
          if (rest.length > 0) return [reg, rest];
        }
      }

      return [text];
    }

    function filterAndRender(reset = false) {
      if (reset) {
        renderedCount = 0;
      }

      const searchTokens = parseSearchTokens(searchQuery);
      const tokenCount = searchTokens.length;

      currentFiltered = places.filter(p => {
        if (currentScope === 'TW' && p.scope !== 'TW') return false;
        if (currentScope === 'INTL' && p.scope !== 'INTL') return false;
        if (selectedRegion !== '全部' && p.region !== selectedRegion) return false;
        if (selectedCategory !== '全部' && p.category !== selectedCategory) return false;

        if (tokenCount > 0) {
          const s = p._s;
          for (let i = 0; i < tokenCount; i++) {
            const token = searchTokens[i];
            let matched = s.includes(token);
            if (!matched) {
              if (token === "清邁" && (s.includes("chiang mai") || s.includes("chiangmai"))) matched = true;
              else if (token === "曼谷" && s.includes("bangkok")) matched = true;
              else if (token === "首爾" && s.includes("seoul")) matched = true;
              else if (token === "釜山" && s.includes("busan")) matched = true;
              else if (token === "東京" && s.includes("tokyo")) matched = true;
              else if (token === "大阪" && s.includes("osaka")) matched = true;
              else if (token === "福岡" && s.includes("fukuoka")) matched = true;
              else if (token === "沖繩" && s.includes("okinawa")) matched = true;
              else if (token === "燒肉" && (s.includes("烤肉") || s.includes("燒烤") || s.includes("bbq"))) matched = true;
              else if (token === "咖啡" && (s.includes("cafe") || s.includes("coffee") || s.includes("咖啡廳"))) matched = true;
              else if (token === "按摩" && (s.includes("massage") || s.includes("spa"))) matched = true;
              else if (token === "拉麵" && s.includes("ramen")) matched = true;
            }
            if (!matched) return false;
          }
        }
        return true;
      });

      if (sortMode === 'distance') {
        currentFiltered.sort((a, b) => {
          if (a.distanceKm == null && b.distanceKm == null) return 0;
          if (a.distanceKm == null) return 1;
          if (b.distanceKm == null) return -1;
          return a.distanceKm - b.distanceKm;
        });
      } else if (sortMode === 'newest') {
        currentFiltered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      } else if (sortMode === 'region') {
        currentFiltered.sort((a, b) => (a.region || '').localeCompare(b.region || '', 'zh-Hant'));
      } else if (sortMode === 'category') {
        currentFiltered.sort((a, b) => (a.category || '').localeCompare(b.category || '', 'zh-Hant'));
      } else if (sortMode === 'name') {
        currentFiltered.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
      }

      document.getElementById('filtered-count').innerText = currentFiltered.length.toLocaleString();
      const isFiltered = (currentScope !== 'ALL' || selectedRegion !== '全部' || selectedCategory !== '全部' || searchQuery !== '');
      document.getElementById('btn-reset-filters').classList.toggle('hidden', !isFiltered);

      const statusDesc = [];
      if (currentScope === 'NEARBY') statusDesc.push('📍 依距離排序');
      else if (currentScope === 'TW') statusDesc.push('台灣地區');
      else if (currentScope === 'INTL') statusDesc.push('國外地區');
      if (selectedRegion !== '全部') statusDesc.push(`「${selectedRegion}」`);
      if (selectedCategory !== '全部') statusDesc.push(`分類「${selectedCategory}」`);
      if (searchQuery) statusDesc.push(`搜尋「${searchQuery}」`);
      document.getElementById('filter-status-desc').innerText = statusDesc.length > 0 ? `(${statusDesc.join(' + ')})` : '';

      const grid = document.getElementById('places-grid');
      grid.innerHTML = '';
      renderedCount = 0;
      appendCardsChunk();
    }

    function appendCardsChunk() {
      const grid = document.getElementById('places-grid');
      const emptyState = document.getElementById('empty-state');
      const loadMoreContainer = document.getElementById('load-more-container');
      const showingCountEl = document.getElementById('showing-count');
      const remainingCountEl = document.getElementById('remaining-count');

      const total = currentFiltered.length;

      if (total === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        loadMoreContainer.classList.add('hidden');
        showingCountEl.innerText = '';
        return;
      }

      emptyState.classList.add('hidden');

      const nextBatch = currentFiltered.slice(renderedCount, renderedCount + PAGE_SIZE);
      if (nextBatch.length === 0) return;

      const htmlChunks = [];
      const len = nextBatch.length;

      for (let i = 0; i < len; i++) {
        const place = nextBatch[i];
        const mapsUrl = place.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.name + ' ' + (place.address || ''))}`;
        const isTW = place.scope === 'TW';
        const regionBadgeClass = isTW ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200 font-semibold';
        const regionIcon = isTW ? '🇹🇼' : '✈️';

        let catColor = "bg-slate-100 text-slate-700 border-slate-200";
        const cat = place.category;
        if (cat === '戶外/生活購物') catColor = "bg-cyan-100/70 text-cyan-800 border-cyan-300";
        else if (cat === '咖啡廳') catColor = "bg-amber-100/70 text-amber-800 border-amber-300";
        else if (cat === '小吃') catColor = "bg-orange-100/70 text-orange-800 border-orange-300";
        else if (cat === '景點') catColor = "bg-emerald-100/70 text-emerald-800 border-emerald-300";
        else if (cat === '甜點/烘焙') catColor = "bg-rose-100/70 text-rose-800 border-rose-300";
        else if (cat === '住宿/飯店') catColor = "bg-violet-100/70 text-violet-800 border-violet-300";
        else if (cat === '酒吧/餐酒館') catColor = "bg-purple-100/70 text-purple-800 border-purple-300";
        else if (cat === '按摩/SPA/體驗') catColor = "bg-pink-100/70 text-pink-800 border-pink-300";
        else if (cat === '早餐/早午餐') catColor = "bg-yellow-100/70 text-yellow-800 border-yellow-300";
        else if (cat === '交通/設施') catColor = "bg-slate-200/80 text-slate-800 border-slate-300";
        else if (cat === '餐廳') catColor = "bg-blue-100/70 text-blue-800 border-blue-300";

        const distText = formatDistance(place.distanceKm);

        htmlChunks.push(`
          <div class="place-card bg-white rounded-xl border border-slate-200/90 hover:border-slate-300 p-4 shadow-2xs hover:shadow transition flex flex-col justify-between group">
            <div>
              <div class="mb-2">
                <h3 class="font-bold text-slate-800 text-sm sm:text-base leading-snug line-clamp-2">${escapeHtml(place.name)}</h3>
              </div>

              <!-- 標籤組 -->
              <div class="flex flex-wrap items-center gap-1.5 mb-2.5">
                ${distText ? `
                  <span class="inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded-md bg-amber-50 text-amber-800 border border-amber-300 shadow-2xs">
                    <i class="ph-bold ph-navigation-arrow text-amber-600"></i> ${distText}
                  </span>
                ` : ''}
                <span class="inline-flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-md border ${regionBadgeClass}">
                  <span>${regionIcon}</span> ${escapeHtml(place.region)}
                </span>
                <span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2 py-0.5 rounded-md border ${catColor}">
                  <i class="ph-fill ph-tag text-[10px]"></i> ${escapeHtml(place.category)}
                </span>
              </div>

              <!-- 地址 -->
              ${place.address ? `
                <p class="text-xs text-slate-500 flex items-start gap-1.5 mb-2">
                  <i class="ph ph-map-pin text-slate-400 shrink-0 mt-0.5"></i>
                  <span class="line-clamp-2">${escapeHtml(place.address)}</span>
                </p>
              ` : ''}

              <!-- 備註說明 -->
              ${place.note ? `
                <div class="text-xs bg-slate-50 text-slate-600 rounded-lg p-2.5 border border-slate-100 my-2 flex items-start gap-1.5">
                  <i class="ph ph-chat-teardrop-dots text-slate-400 text-sm shrink-0 mt-0.5"></i>
                  <span class="leading-relaxed line-clamp-3">${escapeHtml(place.note)}</span>
                </div>
              ` : ''}
            </div>

            <!-- 底部動作按鈕 -->
            <div class="pt-2.5 border-t border-slate-100 mt-2 flex items-center justify-between">
              <span class="text-[11px] text-slate-400">
                ${new Date(place.createdAt || Date.now()).toLocaleDateString('zh-TW')}
              </span>
              <a 
                href="${escapeHtml(mapsUrl)}" 
                target="_blank" 
                rel="noopener noreferrer" 
                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white transition border border-emerald-200 shadow-2xs">
                <i class="ph-fill ph-google-logo text-sm"></i>
                Google Maps
                <i class="ph ph-arrow-square-out text-xs"></i>
              </a>
            </div>
          </div>
        `);
      }

      grid.insertAdjacentHTML('beforeend', htmlChunks.join(''));
      renderedCount += nextBatch.length;

      showingCountEl.innerText = renderedCount < total ? `(已載入 ${renderedCount} / 共 ${total} 筆)` : '';

      if (renderedCount < total) {
        loadMoreContainer.classList.remove('hidden');
        remainingCountEl.innerText = (total - renderedCount).toLocaleString();
      } else {
        loadMoreContainer.classList.add('hidden');
      }
    }

    function escapeHtml(string) {
      if (!string) return '';
      return String(string)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
